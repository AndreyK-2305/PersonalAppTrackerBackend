name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compilación, pruebas unitarias, de arquitectura e integración (Testcontainers usa el Docker del runner).
      - name: Build y pruebas
        run: ./mvnw -B verify

      - name: Construir imagen Docker
        run: docker build -t personal-tracker-backend:ci .
