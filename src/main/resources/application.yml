# Configuración común a todos los perfiles.
# Perfiles: "local" (desarrollo) y "prod". La conexión a la base de datos se define en cada perfil;
# las pruebas la obtienen de Testcontainers.
spring:
  application:
    name: personal-tracker
  autoconfigure:
    # Evita el usuario en memoria con contraseña generada: identity provee la autenticación real.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es dueño del esquema; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    # Cierre por inactividad (D13). Las tablas las crea Flyway (V3).
    timeout: ${SESSION_TIMEOUT:60m}
    jdbc:
      table-name: identity.spring_session
      initialize-schema: never
  web:
    # Mensajes de validación en español, independientes del navegador.
    locale: es_CO
    locale-resolver: fixed

server:
  servlet:
    session:
      # Cookie de sesión de Spring Session (ADR-0004). Secure también aplica en localhost,
      # que los navegadores tratan como origen seguro.
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Deshabilitado salvo en el perfil local.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  identity:
    # Registro cerrado por defecto (D11). Para crear la primera cuenta, ver ADR-0012.
    registration-enabled: ${REGISTRATION_ENABLED:false}
  capture:
    # Cola de notificaciones y limpieza del texto a los 45 días (ADR-0017).
    jobs:
      enabled: ${CAPTURE_JOBS_ENABLED:true}
    worker-interval: ${CAPTURE_WORKER_INTERVAL:PT30S}
    # TRM oficial (datos abiertos de la Superintendencia Financiera).
    exchange-rate-url: ${CAPTURE_EXCHANGE_RATE_URL:https://www.datos.gov.co}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
