# Producción en un servidor propio (Oracle Cloud Always Free; guía en docs/despliegue/oracle-cloud.md).
#
#   cd deploy
#   cp .env.example .env      # y completa los valores
#   docker compose up -d --build --wait
#
# Servicios:
#   postgres  datos en el volumen postgres-data; sin puertos publicados.
#   backend   la API; solo accesible a través de Caddy.
#   caddy     HTTPS automático (Let's Encrypt) para API_DOMAIN y proxy hacia el backend.
#   backup    copia diaria de la base en BACKUP_DIR, conservando BACKUP_KEEP_DAYS días.
#
# El frontend se publica aparte (Netlify) y reenvía /api/* a API_DOMAIN (frontend/netlify.toml).
name: personal-tracker-prod

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-personal_tracker}
      POSTGRES_USER: ${DB_USERNAME:-personal_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
    volumes:
      # Desde PostgreSQL 18 la imagen oficial guarda los datos bajo /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ..
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-personal_tracker}
      DB_USERNAME: ${DB_USERNAME:-personal_tracker}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      # Origen del frontend: Netlify reenvía la cabecera Origin del navegador (https://cuadre.click).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Falta CORS_ALLOWED_ORIGINS en deploy/.env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-60m}
      CAPTURE_JOBS_ENABLED: ${CAPTURE_JOBS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Falta API_DOMAIN en deploy/.env}
    ports:
      # Los puertos del host se pueden cambiar para probar en local (por ejemplo 8443).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados de Let's Encrypt: se conservan entre reinicios.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

  backup:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-personal_tracker}
      PGUSER: ${DB_USERNAME:-personal_tracker}
      PGPASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
