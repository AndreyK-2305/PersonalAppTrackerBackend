# Uso:
#   docker compose up -d                      solo PostgreSQL, para desarrollo local
#   docker compose --profile full up --build  PostgreSQL + backend + frontend (http://localhost:8091)
#                                             + copia diaria de la base en BACKUP_DIR
#   docker compose --profile full --profile tunnel up -d --build --wait
#                                             lo anterior + Cloudflare Tunnel: la app publicada en
#                                             tu dominio desde este equipo (docs/despliegue/equipo-propio.md)
# Las variables se leen de .env (ver .env.example); los valores por defecto son solo para desarrollo.
# Puertos en el host: PostgreSQL 5434, backend 8090 y frontend 8091, para no chocar con otros
# proyectos locales que usan 5432/8080.
name: personal-tracker

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-personal_tracker}
      POSTGRES_USER: ${DB_USERNAME:-personal_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personal_tracker}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      # Desde PostgreSQL 18 la imagen oficial guarda los datos bajo /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [full]
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-personal_tracker}
      DB_USERNAME: ${DB_USERNAME:-personal_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-personal_tracker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-60m}
      CAPTURE_JOBS_ENABLED: ${CAPTURE_JOBS_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Margen amplio: con pocos recursos asignados a Docker, el arranque puede tardar minutos.
      start_period: 180s

  # Requiere el repositorio del frontend clonado como carpeta hermana (../frontend).
  frontend:
    profiles: [full]
    build: ../frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8091}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Copia diaria de la base (formato custom de pg_dump) en BACKUP_DIR; conserva BACKUP_KEEP_DAYS días.
  backup:
    profiles: [full]
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-personal_tracker}
      PGUSER: ${DB_USERNAME:-personal_tracker}
      PGPASSWORD: ${DB_PASSWORD:-personal_tracker}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Cloudflare Tunnel: conexión saliente hacia Cloudflare, sin abrir puertos en el router. El
  # nombre público (track.cuadre.click) y su destino (http://frontend:8080) se configuran en
  # el panel de Cloudflare; aquí solo va el token del túnel.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Obligatorio con el perfil tunnel; sin él, cloudflared no arranca (el resto sigue funcionando).
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres-data:
